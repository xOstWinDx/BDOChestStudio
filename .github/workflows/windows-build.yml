name: Windows build
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[build]"
      - run: python -m unittest discover -s tests -v
      - name: Build executable
        shell: pwsh
        run: ./build.ps1 -Python (Get-Command python).Source
      - name: Check executable and prepare archive
        shell: pwsh
        run: |
          $env:BDO_SIM_DATA_DIR = Join-Path $env:RUNNER_TEMP 'bdo-smoke'
          $process = Start-Process ./dist/BDOChestStudio.exe -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(30000)) { throw 'Executable smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw 'Executable smoke test failed' }
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md -Destination dist
          Compress-Archive -Path dist/BDOChestStudio.exe, dist/LICENSE, dist/THIRD_PARTY_NOTICES.md -DestinationPath dist/BDOChestStudio-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BDOChestStudio-Windows
          path: dist/BDOChestStudio-Windows.zip
          if-no-files-found: error
